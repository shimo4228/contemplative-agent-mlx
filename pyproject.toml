[project]
name = "contemplative-agent-mlx"
version = "0.1.0"
description = "Optional local MLX generation backend (Apple Silicon, mlx_lm.server) for contemplative-agent. Routes generation to a local MLX runtime while keeping embeddings on Ollama. On-device only — no cloud."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Tatsuya Shimomoto"},
]
keywords = [
    "contemplative-agent", "mlx", "apple-silicon", "qwen",
    "llm-backend", "ai-agent", "local-llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# mlx-lm is intentionally NOT a dependency: this backend only speaks HTTP to a
# local mlx_lm.server (started out-of-band via scripts/serve-mlx.sh through
# `uvx --from mlx-lm`), so the package itself stays a thin requests-only shim
# over the main repository's LLMBackend Protocol (ADR-0064, HTTP-only design).
#
# Floor is >=2.10.0, and the version is chosen by the CONFORMANCE KIT rather
# than by the Protocol surface this backend calls.
#
# The surface itself — the BackendResult return contract, the
# LLMBackend.context_window property (ADR-0066), the per-call think flag
# (ADR-0068) — first shipped in v2.7.0. A floor of >=2.7.0 would therefore be
# enough to make this package IMPORT and RUN.
#
# It is not enough to make it VERIFIABLE. ADR-0088 moved the LLMBackend
# conformance kit into main's shipped package (src/contemplative_agent/testing/,
# first released in v2.10.0) precisely so siblings can check themselves against
# the contract instead of hand-copying assertions:
#
#     python -m contemplative_agent.testing \
#       --backend contemplative_agent_mlx.backends.mlx:MlxLmBackend \
#       --kwarg base_url=http://localhost:8080 --kwarg model=conformance-probe
#
# (the kwargs are required — the constructor takes no defaults; main's
# scripts/check-sibling-backends.sh carries the same pair)
#
# Against 2.7.x–2.9.x that command fails with "no module named …testing" — the
# install looks healthy while the one check that proves the contract holds is
# missing. Pinning to the release that carries the kit keeps "installed" and
# "checkable" the same state.
#
# Verified 2026-08-16 against main v2.10.0: ConformanceReport ok, level=static
# (count_tokens.signature skipped as capability_absent). The runtime level needs
# a BackendProbe implementation here and is a separate task.
dependencies = [
    "contemplative-agent>=2.10.0",
]

[project.urls]
Homepage = "https://github.com/shimo4228/contemplative-agent-mlx"
Repository = "https://github.com/shimo4228/contemplative-agent-mlx"
"Main project" = "https://github.com/shimo4228/contemplative-agent"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
contemplative-agent-mlx = "contemplative_agent_mlx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contemplative_agent_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers"]
